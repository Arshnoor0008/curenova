version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: curenova-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - APP_ENV=production
      - JWT_SECRET=curenova_super_secret_jwt_key_med_ai_2026
      - DATABASE_URL=sqlite:///./curenova.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: curenova-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: curenova-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: curenova
      POSTGRES_USER: curenova
      POSTGRES_PASSWORD: curenova_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: curenova-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/curenova_secret
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: curenova-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
